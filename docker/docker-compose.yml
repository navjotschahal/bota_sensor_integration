# One driver container per sensor. Do not run `docker compose` here by hand: use
# scripts/bota_container.sh <cmd> <sensor>, which reads config/sensors.yaml and sets
# the project name (bota_<sensor>), ports, config and device, and adds
# docker-compose.serial.yml when the sensor hangs on a serial/USB adapter.
# Host networking: the stream must reach 127.0.0.1 on the host, and EtherCAT needs
# the raw NIC.
services:
  bota_driver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: bota_ft_sensor/driver:latest
    container_name: bota_${BOTA_SENSOR_NAME:-driver}
    network_mode: host
    restart: unless-stopped
    # NET_RAW/NET_ADMIN only matter for CANopen_over_EtherCAT (raw sockets).
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./config:/config:ro
    environment:
      BOTA_SENSOR_NAME: ${BOTA_SENSOR_NAME:-driver}
      BOTA_CONFIG: ${BOTA_CONFIG:-/config/bota_binary.json}
      BOTA_DATA_HOST: ${BOTA_DATA_HOST:-127.0.0.1}
      BOTA_DATA_PORT: ${BOTA_DATA_PORT:-50100}
      BOTA_CONTROL_PORT: ${BOTA_CONTROL_PORT:-50101}
      BOTA_TARE_ON_START: ${BOTA_TARE_ON_START:-1}
      BOTA_READ_MODE: ${BOTA_READ_MODE:-blocking}
