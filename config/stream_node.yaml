# Parameters of bota_stream_node.py not exposed as launch args.
control_host: 127.0.0.1   # where the forwarder's control port lives (host networking -> localhost)
timeout: 1.0              # s without frames before /diagnostics reports ERROR

# RViz force arrow (display only, data topics are unfiltered)
marker:
  enable: true
  rate: 30.0        # Hz
  filter_hz: 8.0    # low-pass on the displayed vector, 0 = off
  min_force: 0.3    # N, hide the arrow below this
  show_torque: false
  color: [1.0, 0.2, 0.1, 0.9]
